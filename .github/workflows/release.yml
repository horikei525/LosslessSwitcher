name: Build and Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build macOS App
        run: |
          xcodebuild -project Quality.xcodeproj -scheme LosslessSwitcher -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package App into DMG
        run: |
          APP_PATH="build/Build/Products/Release/LosslessSwitcher.app"
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ]; then
            VERSION_TAG="latest"
          fi
          DMG_NAME="LosslessSwitcher-${VERSION_TAG}.dmg"
          
          create-dmg \
            --volname "LosslessSwitcher" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 120 \
            --text-size 13 \
            --icon "LosslessSwitcher.app" 180 200 \
            --hide-extension "LosslessSwitcher.app" \
            --app-drop-link 480 200 \
            "$DMG_NAME" \
            "$APP_PATH"
            
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.DMG_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
